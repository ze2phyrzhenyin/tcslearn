week_id: "week02-algorithms-foundations"
title: "Algorithmic Thinking, Data Structures, and Proof Patterns"
purpose: "建立理论计算机科学视角下的算法基础：formal specification、correctness proof、worst-case/expected/amortized analysis、algorithmic paradigms，以及面向 string algorithms、learning theory、randomized algorithms 和 complexity theory 的证明模式。"
prerequisites:
  - "Week 1 definitions: sets, functions, relations, graphs, probability sample spaces."
  - "Induction, loop invariants, recurrence basics, and Big-O/Theta/Omega language."
  - "Basic Python programming and willingness to run small experiments as intuition only."
learning_goals:
  - "Formalize an algorithmic problem with input, output, precondition, postcondition, and input size."
  - "Prove correctness using loop invariants, recursive induction, representation invariants, exchange arguments, and DP state induction."
  - "Analyze worst-case, expected, and amortized running time with variables stated explicitly."
  - "Recognize when sorting, selection, heaps, hashing, graph traversal, greedy, DP, and randomization are appropriate."
  - "Write small Python labs with asserts and interpret experiments without treating them as proofs."
